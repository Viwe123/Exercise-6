<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>
    <section>
        <form action="contact .html" method="post">
            <label>Name:</label>
            <input type="text">
            <br>
            <label>Email:</label>
            <input type="email">
            <br>
            <label>Phone:</label>
            <input type="tel">
            <br>
            <label>Subject:</label>
            <input type="text">
            <br>
            <label>Message:</label>
            <input type="text">
            <button type="submit">Submit</button>
        </form>
    </section>
    <br>
    <h3>Tick if you are available:</h3>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Availability</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Monday</td>
                <td>5:30 AM</td>
                <td><input type="checkbox"></td>
        </tbody>
                <tbody>
            <tr>
                <td>Tuesday</td>
                <td>8:00 AM</td>
                <td><input type="checkbox"></td>
            </tr>
        </tbody>
                <tbody>
            <tr>
                <td>Wednesday</td>
                <td>10:15 AM</td>
                <td><input type="checkbox"></td>
            </tr>
        </tbody>
        <tbody>
            <tr>
                <td>Thursday</td>
                <td>1:30 PM</td>
                <td><input type="checkbox"></td>
            </tr>
        </tbody>
        <tbody>
            <tr>
                <td>Friday</td>
                <td>3:45 PM</td>
                <td><input type="checkbox"></td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
